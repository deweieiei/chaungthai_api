# ============================================================
#  ChaungThai API - Nginx Reverse Proxy snippet
#  Path: /etc/nginx/snippets/chaungthai-api.conf
#  Included from: /etc/nginx/sites-available/default (HTTPS server block)
#  Forwards: https://<host>/api/...  ->  http://localhost:3000/api/...
#
#  Note: /api/socket.io/ ต้องมี WebSocket upgrade headers (Upgrade/Connection)
#  จึงแยก location block สำหรับ socket.io โดยเฉพาะ
# ============================================================

# Socket.io endpoint — ต้องมี WS upgrade
location /api/socket.io/ {
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WS connections อยู่ยาว — เพิ่ม timeout
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;
}

# REST endpoints
location /api/ {
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}
